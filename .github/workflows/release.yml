name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build archive and checksum
        run: |
          zip -r HarborTrace-${GITHUB_REF_NAME}.zip index.html styles.css app.mjs core.mjs favicon.svg assets/harbortrace-preview.png README.md LICENSE CHANGELOG.md
          sha256sum HarborTrace-${GITHUB_REF_NAME}.zip > HarborTrace-${GITHUB_REF_NAME}.zip.sha256
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" HarborTrace-${GITHUB_REF_NAME}.zip HarborTrace-${GITHUB_REF_NAME}.zip.sha256 --title "HarborTrace $GITHUB_REF_NAME" --generate-notes
